<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTH-Genomic-Compressor Pipeline</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
        body {
            margin: 0;
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            overflow: auto;
        }

        .container {
            padding: 24px;
        }

        .title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            text-align: center;
            font-size: 15px;
            font-style: italic;
            color: #4b5563;
            margin-bottom: 24px;
        }

        svg {
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .lane-label {
            font-size: 15px;
            font-weight: 800;
            fill: #111827;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 1px;
        }

        .node rect,
        .node polygon,
        .node path {
            stroke: #374151;
            stroke-width: 1.2px;
        }

        .process {
            fill: #ffffff;
            rx: 12;
            ry: 12;
        }

        .decision {
            fill: #fff7ed;
        }

        .data {
            fill: #eff6ff;
        }

        .terminal {
            fill: #dcfce7;
            stroke-width: 1.5px;
        }

        .node-text {
            font-size: 11.5px;
            fill: #111827;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        .edge {
            fill: none;
            stroke: #4b5563;
            stroke-width: 1.4px;
            marker-end: url(#arrow);
        }

        .edge-label {
            font-size: 10px;
            fill: #374151;
            font-style: italic;
            background: white;
        }

        .lane-title {
            font-size: 17px;
            font-weight: 700;
            fill: #111827;
        }

        .lane-bg {
            stroke: #d1d5db;
            stroke-width: 1;
            rx: 16;
            ry: 16;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">LTH-Genomic-Compressor: End-to-End Methodological Pipeline</div>
        <div class="subtitle">From Multi-Source Clinical API Acquisition to Deployment-Ready Compressed Genomic
            Classifier</div>

        <svg id="diagram" width="2600" height="12800"></svg>
    </div>

    <script>
        const svg = d3.select('#diagram');
        const width = +svg.attr('width');
        const height = +svg.attr('height');

        const laneColors = [
            '#dbeafe', '#dcfce7', '#ede9fe', '#f3f4f6', '#fae8ff',
            '#ecfccb', '#fee2e2', '#e0f2fe', '#f5f5f4'
        ];

        const laneX = 20;
        const labelWidth = 90;
        const contentX = laneX + labelWidth + 20;
        const contentWidth = width - contentX - 40;
        const laneGap = 24;

        const lanes = [
            {
                title: 'SWIMLANE 1 — MULTI-SOURCE DATASET ACQUISITION',
                short: 'DATA ACQUISITION',
                color: laneColors[0],
                height: 1900
            },
            {
                title: 'SWIMLANE 2 — PREPROCESSING AND SEQUENCE CONSTRUCTION',
                short: 'PREPROCESSING',
                color: laneColors[1],
                height: 900
            },
            {
                title: 'SWIMLANE 3 — MODEL ARCHITECTURE AND INITIALISATION',
                short: 'MODEL INIT',
                color: laneColors[2],
                height: 900
            },
            {
                title: 'SWIMLANE 4 — DENSE BASELINE TRAINING',
                short: 'BASELINE TRAINING',
                color: laneColors[3],
                height: 1200
            },
            {
                title: 'SWIMLANE 5 — IMPORTANCE SIGNAL COLLECTION (WARMUP PHASE)',
                short: 'SIGNAL COLLECTION',
                color: laneColors[4],
                height: 1200
            },
            {
                title: 'SWIMLANE 6 — COMPOSITE IMPORTANCE SCORING AND MASK GENERATION',
                short: 'MASK GENERATION',
                color: laneColors[5],
                height: 1000
            },
            {
                title: 'SWIMLANE 7 — LTH WEIGHT REWINDING AND MASKED FINE-TUNING',
                short: 'MASKED FT',
                color: laneColors[6],
                height: 1300
            },
            {
                title: 'SWIMLANE 8 — DYNAMIC RANK FUSION (ADAPTIVE COEFFICIENT SELECTION)',
                short: 'DRF FUSION',
                color: laneColors[7],
                height: 1000
            },
            {
                title: 'SWIMLANE 9 — OUTPUT AND DEPLOYMENT ARTEFACTS',
                short: 'DEPLOYMENT',
                color: laneColors[8],
                height: 900
            }
        ];

        const defs = svg.append('defs');
        defs.append('marker')
            .attr('id', 'arrow')
            .attr('viewBox', '0 -5 10 10')
            .attr('refX', 9)
            .attr('refY', 0)
            .attr('markerWidth', 7)
            .attr('markerHeight', 7)
            .attr('orient', 'auto')
            .append('path')
            .attr('d', 'M0,-5L10,0L0,5')
            .attr('fill', '#4b5563');

        let currentY = 20;

        function drawLane(y, lane) {
            svg.append('rect')
                .attr('x', laneX)
                .attr('y', y)
                .attr('width', width - 40)
                .attr('height', lane.height)
                .attr('class', 'lane-bg')
                .attr('fill', lane.color);

            svg.append('text')
                .attr('x', laneX + 34)
                .attr('y', y + lane.height / 2)
                .attr('class', 'lane-label')
                .text(lane.short);

            svg.append('text')
                .attr('x', contentX)
                .attr('y', y + 32)
                .attr('class', 'lane-title')
                .text(lane.title);
        }

        function wrapText(textSelection, width) {
            textSelection.each(function () {
                const text = d3.select(this);
                const words = text.text().split(/\s+/).reverse();
                let word;
                let line = [];
                let lineNumber = 0;
                const lineHeight = 1.2;
                const y = text.attr('y');
                const x = text.attr('x');
                const dy = 0;
                let tspan = text.text(null)
                    .append('tspan')
                    .attr('x', x)
                    .attr('y', y)
                    .attr('dy', dy + 'em');

                while (word = words.pop()) {
                    line.push(word);
                    tspan.text(line.join(' '));
                    if (tspan.node().getComputedTextLength() > width) {
                        line.pop();
                        tspan.text(line.join(' '));
                        line = [word];
                        tspan = text.append('tspan')
                            .attr('x', x)
                            .attr('y', y)
                            .attr('dy', ++lineNumber * lineHeight + 'em')
                            .text(word);
                    }
                }
            });
        }

        function node(x, y, w, h, text, type = 'process') {
            const g = svg.append('g').attr('class', 'node');

            if (type === 'decision') {
                const points = [
                    [x + w / 2, y],
                    [x + w, y + h / 2],
                    [x + w / 2, y + h],
                    [x, y + h / 2]
                ].map(p => p.join(',')).join(' ');

                g.append('polygon')
                    .attr('points', points)
                    .attr('class', 'decision');
            } else if (type === 'data') {
                const offset = 18;
                const points = [
                    [x + offset, y],
                    [x + w, y],
                    [x + w - offset, y + h],
                    [x, y + h]
                ].map(p => p.join(',')).join(' ');

                g.append('polygon')
                    .attr('points', points)
                    .attr('class', 'data');
            } else {
                g.append('rect')
                    .attr('x', x)
                    .attr('y', y)
                    .attr('width', w)
                    .attr('height', h)
                    .attr('class', type === 'terminal' ? 'terminal' : 'process');
            }

            const t = g.append('text')
                .attr('class', 'node-text')
                .attr('x', x + w / 2)
                .attr('y', y + h / 2 - 8)
                .text(text);

            wrapText(t, w - 18);

            return { x, y, w, h };
        }

        function edge(a, b, label = '') {
            const x1 = a.x + a.w / 2;
            const y1 = a.y + a.h;
            const x2 = b.x + b.w / 2;
            const y2 = b.y;

            svg.append('path')
                .attr('class', 'edge')
                .attr('d', `M${x1},${y1} L${x1},${(y1 + y2) / 2} L${x2},${(y1 + y2) / 2} L${x2},${y2}`);

            if (label) {
                svg.append('text')
                    .attr('class', 'edge-label')
                    .attr('x', (x1 + x2) / 2)
                    .attr('y', (y1 + y2) / 2 - 6)
                    .text(label);
            }
        }

        lanes.forEach((lane, idx) => {
            drawLane(currentY, lane);

            const laneTop = currentY + 70;

            if (idx === 0) {
                const entry = node(contentX + 850, laneTop, 300, 70, 'Genomic Variant Data Acquisition', 'terminal');

                const columns = [220, 700, 1180, 1660];
                const pipelines = [
                    {
                        title: 'ClinVar',
                        items: [
                            ['NCBI ClinVar REST API', 'data'],
                            ['Endpoint: /eutils/esearch + /eutils/efetch'],
                            ['Filter: GRCh37/hg19 coordinates, standard chromosomes'],
                            ['Filter: Two-star review status or higher'],
                            ['Extract: Pathogenic, Likely Pathogenic variants'],
                            ['Extract: Benign, Likely Benign variants'],
                            ['Enforce per-chromosome 1:1 class balance']
                        ]
                    },
                    {
                        title: 'dbSNP',
                        items: [
                            ['NCBI dbSNP Variation Services API', 'data'],
                            ['Endpoint: /variation/v0/beta/refsnp/'],
                            ['Filter: ClinVar cross-referenced variants'],
                            ['Filter: Established clinical significance only'],
                            ['Label: Pathogenic / Benign from ClinVar annotation'],
                            ['Retain distributional heterogeneity as stress-test source']
                        ]
                    },
                    {
                        title: 'gnomAD',
                        items: [
                            ['gnomAD v4 GraphQL API', 'data'],
                            ['Endpoint: https://gnomad.broadinstitute.org/api'],
                            ['Query: synonymous_variant consequence annotation'],
                            ['Filter: Population allele frequency >= 1% in any sub-population'],
                            ['Sub-populations: AFR, AMR, ASJ, EAS, FIN, NFE, SAS, MID'],
                            ['Label: Benign (frequency-based purifying selection criterion)']
                        ]
                    },
                    {
                        title: 'cBioPortal',
                        items: [
                            ['cBioPortal for Cancer Genomics REST API', 'data'],
                            ['Endpoint: POST /molecular-profiles/{profileId}/mutations/fetch'],
                            ['Fallback: GET /molecular-profiles/{profileId}/mutations'],
                            ['Tier A: TCGA PanCancer Atlas 2018 — uniform MuTect2 pipeline'],
                            ['Tier B: TCGA Firehose Legacy — centre-specific callers'],
                            ['Tier C: TCGA Published — marker-paper subsets'],
                            ['Tier D: Non-TCGA cohorts — MSK-IMPACT, METABRIC, SU2C, DFCI, NSCLC Broad, OncoSG'],
                            ['Qualifying mutation types: Missense, Nonsense, Splice Site, Frameshift Del/Ins, In-Frame Del/Ins, Translation Start Site'],
                            ['Validation: Matched-normal sequencing verified'],
                            ['Label: Pathogenic (somatic, clinically verified)']
                        ]
                    }
                ];

                pipelines.forEach((p, i) => {
                    svg.append('text')
                        .attr('x', contentX + columns[i] + 120)
                        .attr('y', laneTop + 130)
                        .attr('font-size', 15)
                        .attr('font-weight', 800)
                        .attr('text-anchor', 'middle')
                        .text(p.title);

                    let prev = entry;
                    let y = laneTop + 150;
                    let lastNode = null;

                    p.items.forEach((item) => {
                        const n = node(contentX + columns[i], y, 240, 66, item[0], item[1] || 'process');
                        edge(prev, n);
                        prev = n;
                        lastNode = n;
                        y += 92;
                    });

                    pipelines[i].last = lastNode;
                });

                const merge = node(contentX + 860, laneTop + 1140, 320, 70, 'Multi-Source Variant Pool Assembly');

                pipelines.forEach((p) => {
                    edge(p.last, merge);
                });

                const n2 = node(contentX + 860, laneTop + 1250, 320, 70, 'Chromosome 8 reserved exclusively for test partition (zero training leakage)');
                edge(merge, n2);

                const n3 = node(contentX + 860, laneTop + 1360, 320, 70, 'Stratified 1:1 class balance enforced per source');
                edge(n2, n3);

                const d1 = node(contentX + 900, laneTop + 1490, 240, 120, 'Sufficient balanced variants per source?', 'decision');
                edge(n3, d1);

                const yesNode = node(contentX + 900, laneTop + 1660, 240, 60, 'Proceed to preprocessing');
                edge(d1, yesNode, 'Yes');

                pipelines.forEach((p) => {
                    svg.append('path')
                        .attr('class', 'edge')
                        .attr('d', `M${d1.x},${d1.y + d1.h / 2} L${p.last.x - 40},${d1.y + d1.h / 2} L${p.last.x - 40},${p.last.y + 20} L${p.last.x},${p.last.y + 20}`);
                });

                svg.append('text')
                    .attr('x', contentX + 500)
                    .attr('y', laneTop + 1530)
                    .attr('class', 'edge-label')
                    .text('No → Expand query / adjust filters');
            }

            else {
                const centerX = contentX + 760;
                let y = laneTop + 20;

                const laneNodes = {
                    1: [
                        'Dual-Sequence Input Construction',
                        'For each variant: extract 1000 bp window centred on variant position',
                        'Construct Reference Sequence x_ref from GRCh37 reference genome',
                        'Construct Alternate Sequence x_alt by applying variant allele',
                        'Tokenise both sequences using NT-v2 HuggingFace tokeniser (6-mer)',
                        'Pad / truncate to fixed token length of 256 tokens per sequence',
                        'Output per sample: [ref_input_ids, ref_attention_mask, alt_input_ids, alt_attention_mask, label]',
                        'Dataset Split Construction'
                    ],
                    2: [
                        'Load Pre-trained Nucleotide Transformer v2-100M',
                        'Architecture: 20-layer transformer encoder, hidden dim 512, 8 attention heads, FFN dim 2048',
                        'Pre-training: Masked Language Modelling on 850-species multi-species genome corpus',
                        'Attach Binary Classification Head',
                        'Classifier Input: Concatenate [CLS token | mean-pooled ref | mean-pooled alt] → 1536-dim vector',
                        'Two-layer MLP with dropout → 2-class logit output',
                        'Save Initial Checkpoint θ⁽⁰⁾ (pre-trained weights before any gradient update)',
                        'Unfreeze full backbone (22 parameter-containing layers)',
                        'Configure differential learning rates: backbone lr << head lr'
                    ],
                    3: [
                        'Training Objective: Focal Loss with Label Smoothing',
                        'Focal modulating factor (1-p_c)^γ suppresses easy-example gradients',
                        'Label smoothing prevents overconfident predictions on uncertain clinical annotations',
                        'Optimiser: AdamW with decoupled weight decay',
                        'LR Schedule: Cosine annealing with linear warmup over first 15% of steps',
                        'Gradient accumulation over multiple steps → effective large batch training',
                        'Per-epoch evaluation on validation set'
                    ],
                    4: [
                        'Warmup Training Phase (dense model continues training)',
                        'Signal A — Weight Magnitude: record |θᵢ| for all prunable parameters',
                        'Signal B — EMA Gradient Tracking: update bias-corrected EMA of |∂L/∂θᵢ| at every step with decay β=0.999',
                        'EMA integrates gradient information over long training horizon → captures temporally persistent importance',
                        'Signal C — Weight Movement: record |θᵢ_final − θᵢ⁽⁰⁾| after warmup completion',
                        'Weight movement captures net directional adaptation to target dataset',
                        'Signal D — Fisher Information: post-warmup estimation via accumulated squared gradients over sampled training batches',
                        'Diagonal FIM approximates loss-surface curvature per parameter',
                        'Fisher identifies parameters whose removal causes sharpest loss increase',
                        'All four signals stored as importance tensors of shape [N_parameters]'
                    ],
                    5: [
                        'Percentile Rank Transformation (applied independently per signal)',
                        'r_i^(k) = rank(s_i^(k)) / N → uniform marginal, scale-invariant, outlier-robust',
                        'Composite Score: S_i(α) = α₁·r_mag + α₂·r_ema + α₃·r_fisher + α₄·r_mov',
                        'Global threshold: θ_s = s-th percentile of {S_i} across all N parameters',
                        'Binary mask: M_i = 1 if S_i > θ_s, else M_i = 0',
                        'Global mask allocation — sparsity budget distributed according to composite criterion, not uniformly per layer',
                        'Apply mask: zero all pruned weights'
                    ],
                    6: [
                        'LTH Weight Rewinding: reset surviving weights to θᵢ⁽⁰⁾ (initial pre-trained values)',
                        'Rewinding preserves pre-trained genomic inductive bias (nucleotide motifs, codon structure, conserved elements)',
                        'Masked Fine-Tuning: freeze mask M throughout training',
                        'Masked backpropagation: zero gradient of pruned weights → ∂L/∂θᵢ ← (∂L/∂θᵢ) · Mᵢ',
                        'Training objective: Focal Loss (γ=2.5) with label smoothing (ε=0.10)',
                        'Optimiser: AdamW, cosine warmup schedule, gradient norm clipping',
                        'Gradient accumulation → stable effective batch size on compressed parameter space',
                        'Stochastic Weight Averaging commences at 60% of fine-tuning epochs',
                        'SWA averages weight snapshots → wider loss-surface minimum → improved generalisation',
                        'SWA BN update: recalibrate batch norm running statistics over full training set'
                    ],
                    7: [
                        'Preliminary Intelligence Pass: four independent compression runs, one per signal (Magnitude / EMA / Fisher / Movement)',
                        'Each single-signal run produces per-sparsity validation AUROC: A_k(s)',
                        'DRF Softmax Weighting: α_k(s) = softmax({A_k(s)} / τ), τ=0.05',
                        'Low temperature concentrates weight on highest-performing signal per sparsity level',
                        'Hybrid Composite Score: S_i^hybrid(s) = Σ_k α_k(s) · r_i^(k)',
                        'Fusion weights α_k(s) are fully data-driven — no hand-tuning',
                        'Generate hybrid mask at each sparsity level s ∈ {10%, 20%, 30%, 50%, 60%}',
                        'Rewind to θ⁽⁰⁾; run masked fine-tuning with extended epoch budget and earlier SWA start',
                        'Evaluate Hybrid Model: full metric suite at each sparsity level'
                    ],
                    8: [
                        'For each sparsity level and each scorer: save compressed weight file (.pth)',
                        '.pth contents: weight tensors (FP32) + boolean masks only — no model code',
                        'Self-contained artefact: direct plug-in inference without model redistribution',
                        'Five individual scorer files × five sparsity levels + five hybrid files',
                        'Final Output: per-sparsity comparison matrix across all scorers and hybrid',
                        'Metrics recorded: Accuracy, AUROC, F1, MCC, Precision, Recall, Specificity, Δ vs Dense',
                        'Deployment-ready compressed genomic classifier'
                    ]
                };

                let prev = null;

                laneNodes[idx].forEach((txt, i) => {
                    const type = (idx === 8 && i === laneNodes[idx].length - 1) ? 'terminal' : 'process';
                    const n = node(centerX, y, 520, 68, txt, type);
                    if (prev) edge(prev, n);
                    prev = n;
                    y += 95;

                    if (idx === 1 && i === 7) {
                        const branches = ['Training Set', 'Validation Set', 'Held-Out Test Sets (3 independent sources)'];
                        const xs = [centerX - 450, centerX, centerX + 450];
                        const branchNodes = [];

                        branches.forEach((b, bi) => {
                            const bn = node(xs[bi], y + 20, 280, 60, b, 'process');
                            edge(prev, bn);
                            branchNodes.push(bn);

                            if (bi === 2) {
                                const leaves = [
                                    'ClinVar Unseen',
                                    'dbSNP Unseen',
                                    'cBioPortal + gnomAD Unseen'
                                ];
                                let ly = y + 120;
                                let leafPrev = bn;
                                leaves.forEach((l) => {
                                    const ln = node(xs[bi] + 10, ly, 260, 56, l);
                                    edge(leafPrev, ln);
                                    leafPrev = ln;
                                    ly += 80;
                                });
                                branchNodes[bi] = leafPrev;
                            }
                        });

                        const recon = node(centerX, y + 380, 320, 60, 'Unified downstream training pipeline');
                        branchNodes.forEach(b => edge(b, recon));
                        prev = recon;
                        y += 500;
                    }

                    if (idx === 3 && i === 6) {
                        const d1 = node(centerX + 90, y + 10, 340, 110, 'Validation AUROC improved?', 'decision');
                        edge(prev, d1);

                        const yes = node(centerX + 420, y + 150, 280, 60, 'Save best checkpoint; continue training');
                        const no = node(centerX - 380, y + 150, 280, 60, 'Increment patience counter');
                        edge(d1, yes, 'Yes');
                        edge(d1, no, 'No');

                        const d2 = node(centerX - 330, y + 270, 240, 110, 'Patience threshold reached?', 'decision');
                        edge(no, d2);

                        svg.append('path')
                            .attr('class', 'edge')
                            .attr('d', `M${d2.x + d2.w},${d2.y + d2.h / 2} L${centerX + 250},${d2.y + d2.h / 2} L${centerX + 250},${prev.y + 20} L${centerX + 260},${prev.y + 20}`);

                        svg.append('text')
                            .attr('class', 'edge-label')
                            .attr('x', centerX + 100)
                            .attr('y', d2.y + 40)
                            .text('No → Continue Training');

                        const es = node(centerX + 100, y + 430, 360, 60, 'Early stopping triggered');
                        edge(d2, es, 'Yes');

                        const restore = node(centerX + 100, y + 540, 420, 60, 'Restore best validation AUROC checkpoint as Dense Baseline Model');
                        edge(es, restore);

                        const evalNode = node(centerX + 100, y + 650, 420, 60, 'Evaluate on all three independent held-out test sets');
                        edge(restore, evalNode);

                        const metrics = node(centerX + 100, y + 760, 420, 60, 'Record full metric suite: Accuracy, AUROC, F1, MCC, Precision, Recall, Specificity');
                        edge(evalNode, metrics);
                    }

                    if (idx === 5 && i === 6) {
                        const sparsity = ['s=10%', 's=20%', 's=30%', 's=50%', 's=60%'];
                        const xs = [centerX - 600, centerX - 300, centerX, centerX + 300, centerX + 600];
                        const spNodes = [];

                        sparsity.forEach((s, si) => {
                            const sn = node(xs[si], y + 20, 180, 60, s, 'process');
                            edge(prev, sn);
                            spNodes.push(sn);
                        });

                        const recon = node(centerX, y + 180, 360, 60, 'Reconverge into sparse fine-tuning stage');
                        spNodes.forEach(s => edge(s, recon));
                        prev = recon;
                        y += 300;
                    }

                    if (idx === 6 && i === 9) {
                        const d1 = node(centerX + 80, y + 10, 340, 110, 'Validation AUROC improved?', 'decision');
                        edge(prev, d1);

                        const yes = node(centerX + 430, y + 140, 260, 60, 'Save best sparse checkpoint; continue');
                        const no = node(centerX - 350, y + 140, 260, 60, 'Increment patience counter');
                        edge(d1, yes, 'Yes');
                        edge(d1, no, 'No');

                        const d2 = node(centerX - 300, y + 260, 240, 110, 'Patience reached?', 'decision');
                        edge(no, d2);

                        const restore = node(centerX + 80, y + 420, 420, 60, 'Restore best sparse checkpoint (or SWA checkpoint if superior)');
                        edge(d2, restore, 'Yes');

                        svg.append('path')
                            .attr('class', 'edge')
                            .attr('d', `M${d2.x + d2.w},${d2.y + d2.h / 2} L${centerX + 250},${d2.y + d2.h / 2} L${centerX + 250},${prev.y + 20} L${centerX + 260},${prev.y + 20}`);

                        const evalNode = node(centerX + 80, y + 530, 420, 60, 'Evaluate compressed model: full metric suite on validation set');
                        edge(restore, evalNode);

                        const rec = node(centerX + 80, y + 640, 420, 60, 'Record per-sparsity AUROC: A_k(s) for current scorer k');
                        edge(evalNode, rec);
                    }
                });
            }

            currentY += lane.height + laneGap;
        });
    </script>
</body>

</html>
